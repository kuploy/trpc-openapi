name: CI

# Builds and tests the package on every PR and on pushes to main.
#
# There was no CI here at all: nothing triggered on pull_request, and
# publish.yml never ran a build or a test before publishing. So a change that
# did not compile could reach GitHub Packages, and `kuploy` and `kuploy-cloud`
# would find out on their next install.
#
# `test` is gated as of #7. It was build-only before that: the suite was
# inherited from upstream Dokploy, had been red since the fork rewrote src/,
# and wiring it in would have landed a permanently red required check. Adapting
# it (#4, #5, #6, #7) surfaced seven shipped bugs -- a red suite nobody could
# read was hiding live defects -- and the last six failures are now closed, so
# 86/86 pass against zod 4 and the check is meaningful.
#
# `pnpm test` is `tsc --noEmit && jest`, so this also type-checks the tests,
# which `pnpm run build` (tsconfig.build.json) excludes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      # Frozen: the lockfile is in sync on main and drift should fail here
      # rather than be silently resolved away, which is what publish.yml's
      # `--no-frozen-lockfile` allows today.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
